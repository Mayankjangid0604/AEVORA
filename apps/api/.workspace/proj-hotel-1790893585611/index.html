<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hotel App Core</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Hotel App Core</h1>
    <nav>
      <button onclick="showTab('rooms')">Rooms</button>
      <button onclick="showTab('guests')">Guests</button>
    </nav>
  </header>

  <main>
    <section id="rooms" class="tab">
      <h2>Room Booking</h2>
      <form id="roomForm">
        <input type="text" id="roomNum" placeholder="Room Number" required>
        <input type="text" id="roomType" placeholder="Type (Single/Double)" required>
        <button type="submit">Add Room</button>
      </form>
      <ul id="roomList"></ul>
    </section>

    <section id="guests" class="tab" style="display:none;">
      <h2>Guest Management</h2>
      <form id="guestForm">
        <input type="text" id="guestName" placeholder="Guest Name" required>
        <input type="text" id="guestRoom" placeholder="Assigned Room" required>
        <button type="submit">Add Guest</button>
      </form>
      <ul id="guestList"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
