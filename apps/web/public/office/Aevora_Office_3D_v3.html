<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aevora HQ — Walkable 3D Office</title>
<script type="importmap">
{
  "imports": {
    "three": "/office/three/three.module.js",
    "three/addons/controls/OrbitControls.js": "/office/three/addons/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "/office/three/addons/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "/office/three/addons/exporters/GLTFExporter.js"
  }
}
</script>
<link rel="stylesheet" href="_ds/nocturne/styles.css">
<style>
  html, body { margin: 0; height: 100%; background: var(--color-bg); overflow: hidden; }
  a { color: var(--color-accent-300); } a:hover { color: var(--color-accent-200); }
  three-d-stage:not(:defined) { visibility: hidden; }
  three-d-stage { display: block; width: 100vw; height: 100vh; }
  .hud { position: fixed; top: var(--space-3); left: var(--space-3); width: 240px; z-index: 5;
    background: color-mix(in srgb, var(--color-surface) 88%, transparent); backdrop-filter: blur(8px);
    box-shadow: var(--shadow-md); }
  .modes { display: flex; gap: var(--space-1); }
  .modes .btn { flex: 1; }
  .hint { position: fixed; left: 50%; bottom: var(--space-4); transform: translateX(-50%); z-index: 5;
    display: none; gap: var(--space-2); align-items: center; font-size: 12px; color: var(--color-neutral-200);
    background: color-mix(in srgb, var(--color-surface) 88%, transparent); padding: 8px 14px;
    border-radius: var(--radius-md); box-shadow: var(--shadow-md); white-space: nowrap; }
  .hint kbd { font: inherit; font-size: 11px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--color-divider); color: var(--color-text); }
  body.walking .hint { display: flex; }
  .where { position: fixed; top: var(--space-3); left: 50%; transform: translateX(-50%); z-index: 5; display: none; font-size: 13px; white-space: nowrap; }
  body.walking .where { display: inline-flex; }
  .crosshair { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%;
    border: 1px solid var(--color-accent-300); display: none; z-index: 4; pointer-events: none; }
  body.walking .crosshair { display: block; }
  body.walking three-d-stage { cursor: grab; }
  .minimap { position: fixed; right: 16px; bottom: 72px; z-index: 5; width: 150px; height: 206px; border-radius: 8px;
    background: rgba(10, 12, 24, 0.72); box-shadow: var(--shadow-md); pointer-events: none; }
  .subtitle { position: fixed; left: 50%; bottom: 64px; transform: translateX(-50%); z-index: 6; max-width: min(640px, 80vw);
    padding: 6px 14px; border-radius: 6px; background: rgba(0, 0, 0, 0.72); color: #fff; font-size: 15px; text-align: center;
    opacity: 0; transition: opacity 0.2s; pointer-events: none; }
  .subtitle.on { opacity: 1; }
  body.photo .hud, body.photo .minimap, body.photo .hint, body.photo .crosshair, body.photo .where, body.photo .subtitle { display: none !important; }
  body.cctv .hud, body.cctv .hint, body.cctv .crosshair, body.cctv .where, body.cctv .minimap { display: none !important; }
  .board { position: fixed; top: var(--space-3); right: var(--space-3); width: 250px; z-index: 5;
    background: color-mix(in srgb, var(--color-surface) 90%, transparent); backdrop-filter: blur(8px); box-shadow: var(--shadow-md); }
  .board .modes .btn { font-size: 12px; padding-left: 4px; padding-right: 4px; }
  .brief { position: fixed; right: 16px; bottom: 290px; z-index: 5; }
  .board[hidden], .brief[hidden] { display: none !important; }
  body.photo .board, body.photo .brief, body.cctv .board, body.cctv .brief { display: none !important; }
  .loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 6; pointer-events: none; font-size: 13px; color: var(--color-neutral-300); }
</style>
</head>
<body>
<three-d-stage name="aevora-office" background="#161826"></three-d-stage>

<div class="hud card">
  <div class="card-kicker">Aevora HQ</div>
  <div class="card-title">Autonomous AI Company</div>
    <div class="modes">
    <button class="btn btn-primary" id="mOrbit">Overview</button>
    <button class="btn btn-secondary" id="mWalk">Walk</button>
  </div>
  <div class="modes" style="margin-top: var(--space-2)">
    <button class="btn btn-secondary" id="mAudio" aria-pressed="false">Ambience: off</button>
    <select class="input" id="lang" aria-label="Subtitle language">
      <option value="en">English</option><option value="hinglish">Hinglish</option><option value="hi">हिंदी</option>
    </select>
  </div>
  <div class="modes" style="margin-top: var(--space-2)">
    <button class="btn btn-secondary" id="mIntercom" title="Announce something to the whole office">Intercom</button>
    <button class="btn btn-secondary" id="mMic" aria-pressed="false" title="Say “Hey Aevora…” (Chrome)">Mic: off</button>
    <button class="btn btn-secondary" id="mDrill" title="Run a fire drill">Drill</button>
  </div>
  <div class="modes" style="margin-top: var(--space-2)">
    <button class="btn btn-secondary" id="mCctv" title="Security cameras (Esc to exit)">CCTV</button>
    <button class="btn btn-secondary" id="mPhoto" title="Save a picture of this view">Photo</button>
    <button class="btn btn-secondary" id="mVr" title="Virtual reality (needs a VR headset)" disabled>VR</button>
  </div>
  <div class="field">
    <label for="zone">Go to</label>
    <select class="input" id="zone"></select>
  </div>
</div>
<div class="loading" id="loading">Building the office…</div>
<div class="where tag tag-accent" id="where">Entrance</div>
<div class="crosshair"></div>
<canvas class="minimap" id="minimap" width="150" height="206" aria-label="Mini-map"></canvas>
<div class="subtitle" id="subtitle" role="status" aria-live="polite"></div>
<div class="board card" id="board" hidden>
  <div class="card-kicker">Board meeting <span id="bLead"></span></div>
  <div class="card-title" id="bTitle"></div>
  <div id="bItem" style="font-size:12px;color:var(--color-neutral-300);margin:2px 0 6px"></div>
  <div class="modes"><button class="btn btn-secondary" id="bPause">Pause</button><button class="btn btn-secondary" id="bSkip">Skip line</button><button class="btn btn-secondary" id="bMute" aria-pressed="false">Mute</button></div>
  <div class="modes" style="margin-top: var(--space-2)"><button class="btn btn-secondary" id="bPrev" aria-label="Previous slide">◀ Slide</button><button class="btn btn-secondary" id="bNext" aria-label="Next slide">Slide ▶</button><button class="btn btn-secondary" id="bSay" title="Speak (mic) or type">Speak</button></div>
  <div class="modes" style="margin-top: var(--space-2)"><button class="btn btn-secondary" id="bEnd">End meeting</button></div>
</div>
<button class="btn btn-primary brief" id="bBrief" hidden>Read meeting summary</button>
<audio id="ambience" loop preload="none"></audio>
<div id="cctv" style="display:none;position:fixed;inset:0;z-index:7;pointer-events:none;font:14px monospace;color:#fff">
  <div style="position:absolute;top:14px;right:18px;background:rgba(0,0,0,.55);padding:4px 10px"><span style="color:#ff3030">● REC</span> <span id="cctvName"></span> · <span id="cctvTime"></span></div>
  <div style="position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 2px,transparent 2px 4px)"></div>
</div>
<div class="hint"><span><kbd>W A S D</kbd> move</span><span><kbd>drag</kbd> look</span><span><kbd>Shift</kbd> run</span><span><kbd>Esc</kbd> overview</span></div>

<script src="three-d-stage.js"></script>
<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;
await document.fonts.ready;
const scene = stage._scene, cam = stage._camera, controls = stage._controls, renderer = stage._renderer;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;

let seed = 11; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const pick = a => a[(rnd() * a.length) | 0];
const V3 = THREE.Vector3, ONE = new V3(1, 1, 1), _y = new V3(0, 1, 0);

// ---------- procedural textures ----------
function canvasTex(w, h, draw, { repeat = false, data = false } = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = data ? THREE.NoColorSpace : THREE.SRGBColorSpace; t.anisotropy = 8;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
function noise(g, w, h, a) {
  const d = g.getImageData(0, 0, w, h), p = d.data;
  for (let i = 0; i < p.length; i += 4) { const n = (Math.random() - 0.5) * a; p[i] += n; p[i + 1] += n; p[i + 2] += n; }
  g.putImageData(d, 0, 0);
}
function vein(g, x, y, a, len, width, col, jitter = 0.25) {
  g.strokeStyle = col; g.lineWidth = width; g.lineCap = 'round'; g.beginPath(); g.moveTo(x, y);
  for (let i = 0; i < len; i += 6) { a += (Math.random() - 0.5) * jitter; x += Math.cos(a) * 6; y += Math.sin(a) * 6; g.lineTo(x, y); }
  g.stroke();
}
// marble: 2x2 tiles (1.2 m each) per texture repeat
const marbleTex = canvasTex(2048, 2048, (g, w, h) => {
  const s = w / 2;
  for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) {
    g.save(); g.beginPath(); g.rect(i * s, j * s, s, s); g.clip();
    const base = g.createLinearGradient(i * s, j * s, i * s + s, j * s + s);
    base.addColorStop(0, '#f3f1ed'); base.addColorStop(1, '#e8e4dd'); g.fillStyle = base; g.fillRect(i * s, j * s, s, s);
    g.filter = 'blur(18px)';
    for (let k = 0; k < 16; k++) { g.fillStyle = `rgba(${190 + rnd() * 20},${186 + rnd() * 20},${180 + rnd() * 16},0.18)`; g.beginPath(); g.ellipse(i * s + rnd() * s, j * s + rnd() * s, 40 + rnd() * 160, 20 + rnd() * 60, rnd() * 3, 0, 7); g.fill(); }
    const a0 = rnd() * Math.PI;
    g.filter = 'blur(2.5px)';
    for (let k = 0; k < 5; k++) vein(g, i * s + rnd() * s, j * s + rnd() * s, a0 + (rnd() - 0.5) * 0.6, 900, 3 + rnd() * 5, 'rgba(150,144,136,0.28)');
    g.filter = 'blur(0.6px)';
    for (let k = 0; k < 9; k++) vein(g, i * s + rnd() * s, j * s + rnd() * s, a0 + (rnd() - 0.5) * 1.2, 500 + rnd() * 500, 0.8 + rnd() * 1.6, 'rgba(110,104,98,0.45)', 0.4);
    for (let k = 0; k < 4; k++) vein(g, i * s + rnd() * s, j * s + rnd() * s, a0 + 0.3, 700, 1.2, 'rgba(176,150,112,0.35)', 0.35);
    g.filter = 'none'; g.restore();
  }
  noise(g, w, h, 5);
  g.fillStyle = '#c9c3b9'; for (let k = 0; k <= 2; k++) { g.fillRect(k * s - 1.5, 0, 3, h); g.fillRect(0, k * s - 1.5, w, 3); }
}, { repeat: true });
const carpetTex = canvasTex(1024, 1024, (g, w, h) => {
  const s = w / 2;
  for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) {
    const L = 88 + (rnd() - 0.5) * 10; g.fillStyle = `rgb(${L},${L + 3},${L + 10})`; g.fillRect(i * s, j * s, s, s);
    const hz = (i + j) % 2;
    for (let k = 0; k < s; k += 3) {
      g.fillStyle = `rgba(${k % 6 ? 255 : 0},${k % 6 ? 255 : 0},${k % 6 ? 255 : 0},0.05)`;
      hz ? g.fillRect(i * s, j * s + k, s, 1.5) : g.fillRect(i * s + k, j * s, 1.5, s);
    }
  }
  const d = g.getImageData(0, 0, w, h), p = d.data;
  for (let i = 0; i < p.length; i += 4) { const n = (Math.random() - 0.5) * 60 * (Math.random() > 0.5 ? 1 : 0.4); p[i] += n; p[i + 1] += n; p[i + 2] += n; }
  g.putImageData(d, 0, 0);
  g.fillStyle = 'rgba(0,0,0,0.35)'; for (let k = 0; k <= 2; k++) { g.fillRect(k * s - 1, 0, 2, h); g.fillRect(0, k * s - 1, w, 2); }
}, { repeat: true });
function plankTex(hue, sat, l0, l1, planks, seams = true) {
  return canvasTex(1024, 1024, (g, w, h) => {
    const pw = w / planks;
    for (let i = 0; i < planks; i++) {
      let y = -rnd() * 500;
      while (y < h) {
        const len = seams ? 380 + rnd() * 420 : h * 2, L = l0 + rnd() * (l1 - l0);
        g.fillStyle = `hsl(${hue + (rnd() - 0.5) * 4}, ${sat}%, ${L}%)`; g.fillRect(i * pw, y, pw, len);
        for (let k = 0; k < pw * 0.5; k++) {
          g.strokeStyle = `hsla(${hue - 4}, ${sat + 6}%, ${L * 0.55}%, ${0.05 + rnd() * 0.16})`; g.lineWidth = 0.5 + rnd() * 1.8; g.beginPath();
          const x0 = i * pw + rnd() * pw, amp = 2 + rnd() * 7, f = 0.004 + rnd() * 0.01, ph = rnd() * 6;
          g.moveTo(x0, y); for (let t = 0; t <= len; t += 12) g.lineTo(x0 + Math.sin(t * f + ph) * amp, y + t); g.stroke();
        }
        if (rnd() > 0.6) { g.strokeStyle = `hsla(${hue - 6}, ${sat}%, ${L * 0.5}%, 0.35)`; g.lineWidth = 1.2; const cx = i * pw + pw * (0.3 + rnd() * 0.4), cy = y + rnd() * len; for (let r = 3; r < 16; r += 3) { g.beginPath(); g.ellipse(cx, cy, r * 0.6, r * 2.2, 0, 0, 7); g.stroke(); } }
        if (seams) { g.fillStyle = 'rgba(20,12,6,0.55)'; g.fillRect(i * pw, y, pw, 2); }
        y += len;
      }
      if (seams) { g.fillStyle = 'rgba(20,12,6,0.5)'; g.fillRect(i * pw, 0, 1.5, h); }
    }
    noise(g, w, h, 6);
  }, { repeat: true });
}
const oakFloorTex = plankTex(32, 36, 52, 60, 7);
const darkWoodTex = plankTex(20, 38, 15, 21, 9);
const walnutTex = plankTex(24, 34, 27, 33, 4, false);
const deskOakTex = canvasTex(1024, 1024, (g, w, h) => {
  g.fillStyle = 'hsl(34, 38%, 70%)'; g.fillRect(0, 0, w, h);
  for (let k = 0; k < 420; k++) {
    g.strokeStyle = `hsla(30, 42%, ${40 + rnd() * 18}%, ${0.04 + rnd() * 0.12})`; g.lineWidth = 0.5 + rnd() * 1.8; g.beginPath();
    const y0 = rnd() * h, amp = 3 + rnd() * 10, f = 0.003 + rnd() * 0.008, ph = rnd() * 6;
    g.moveTo(0, y0); for (let x = 0; x <= w; x += 12) g.lineTo(x, y0 + Math.sin(x * f + ph) * amp); g.stroke();
  }
  noise(g, w, h, 5);
}, { repeat: true });
const ceilingTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#efeeea'; g.fillRect(0, 0, w, h);
  const d = g.getImageData(0, 0, w, h), p = d.data;
  for (let i = 0; i < p.length; i += 4) { const n = Math.random() > 0.93 ? -26 : (Math.random() - 0.5) * 8; p[i] += n; p[i + 1] += n; p[i + 2] += n; }
  g.putImageData(d, 0, 0);
  const s = w / 2;
  for (let k = 0; k <= 2; k++) { g.fillStyle = '#d6d4cf'; g.fillRect(k * s - 5, 0, 10, h); g.fillRect(0, k * s - 5, w, 10); g.fillStyle = 'rgba(0,0,0,0.12)'; g.fillRect(k * s + 5, 0, 2, h); g.fillRect(0, k * s + 5, w, 2); }
}, { repeat: true });
const fabricTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#808080'; g.fillRect(0, 0, w, h);
  for (let y = 0; y < h; y += 4) for (let x = 0; x < w; x += 4) { g.fillStyle = ((x + y) / 4) % 2 ? '#9a9a9a' : '#6a6a6a'; g.fillRect(x, y, 3, 3); }
  noise(g, w, h, 40);
}, { repeat: true, data: true });
const radialAlpha = canvasTex(256, 256, (g, w, h) => {
  const r = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
  r.addColorStop(0, '#fff'); r.addColorStop(0.45, '#999'); r.addColorStop(0.75, '#333'); r.addColorStop(1, '#000');
  g.fillStyle = r; g.fillRect(0, 0, w, h);
}, { data: true });
const edgeAlpha = canvasTex(8, 256, (g, w, h) => {
  const r = g.createLinearGradient(0, 0, 0, h); r.addColorStop(0, '#fff'); r.addColorStop(0.35, '#777'); r.addColorStop(1, '#000');
  g.fillStyle = r; g.fillRect(0, 0, w, h);
}, { data: true });
const glowTex = canvasTex(256, 256, (g, w, h) => {
  const r = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
  r.addColorStop(0, '#fff'); r.addColorStop(0.3, '#8a8a8a'); r.addColorStop(0.65, '#262626'); r.addColorStop(1, '#000');
  g.fillStyle = r; g.fillRect(0, 0, w, h);
});
function dash(accents) {
  return canvasTex(512, 288, (g, w, h) => {
    g.fillStyle = '#0f1426'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#18203a'; g.fillRect(0, 0, w, 26);
    g.fillStyle = 'rgba(233,233,237,0.75)'; g.fillRect(14, 10, 90, 6);
    for (let c = 0; c < 3; c++) { g.fillStyle = '#161d35'; g.fillRect(14 + c * 164, 38, 152, 50); g.fillStyle = accents[c % 3]; g.fillRect(24 + c * 164, 60, 40 + rnd() * 70, 10); g.fillStyle = 'rgba(233,233,237,0.5)'; g.fillRect(24 + c * 164, 48, 50, 5); }
    g.fillStyle = '#161d35'; g.fillRect(14, 100, 300, 176); g.fillRect(326, 100, 172, 176);
    g.fillStyle = accents[0];
    for (let i = 0; i < 12; i++) { const bh = 20 + rnd() * 120; g.fillRect(28 + i * 23, 262 - bh, 13, bh); }
    g.strokeStyle = accents[1]; g.lineWidth = 2.5; g.beginPath();
    for (let i = 0; i <= 8; i++) { const x = 340 + i * 18, y = 240 - rnd() * 60 - i * 12; i ? g.lineTo(x, y) : g.moveTo(x, y); }
    g.stroke();
  });
}
function mapTex() {
  return canvasTex(1024, 512, (g, w, h) => {
    g.fillStyle = '#081330'; g.fillRect(0, 0, w, h);
    for (let y = 14; y < h - 8; y += 10) for (let x = 8; x < w - 6; x += 10) {
      const nx = x / w, ny = y / h;
      const land = Math.sin(nx * 9) * Math.cos(ny * 6 + nx * 3) + Math.sin(nx * 21 + ny * 4) * 0.4 > 0.25 && ny > 0.12 && ny < 0.88;
      if (land) { g.fillStyle = rnd() > 0.95 ? '#ffd27a' : 'rgba(110,170,255,0.8)'; g.beginPath(); g.arc(x, y, 2.4, 0, 7); g.fill(); }
    }
  });
}
const skyTex = canvasTex(4096, 512, (g, w, h) => {
  const s = g.createLinearGradient(0, 0, 0, h); s.addColorStop(0, '#0b0e1c'); s.addColorStop(0.55, '#1a1c34'); s.addColorStop(0.85, '#3a3350'); s.addColorStop(1, '#4a3f58');
  g.fillStyle = s; g.fillRect(0, 0, w, h);
  for (const [tone, maxH, lit] of [['#151828', 300, 0.25], ['#0d0f1a', 420, 0.35]]) {
    for (let x = 0; x < w;) {
      const bw = 30 + rnd() * 90, bh = 60 + rnd() * maxH;
      g.fillStyle = tone; g.fillRect(x, h - bh, bw, bh);
      for (let yy = h - bh + 8; yy < h - 4; yy += 9) for (let xx = x + 4; xx < x + bw - 4; xx += 7) if (rnd() < lit) { g.fillStyle = rnd() > 0.3 ? 'rgba(255,214,160,0.85)' : 'rgba(190,210,255,0.7)'; g.fillRect(xx, yy, 3, 4); }
      x += bw + rnd() * 6;
    }
  }
});

// ---------- floor reflection (planar, walk mode) ----------
const reflRT = new THREE.WebGLRenderTarget(2, 2, { type: THREE.HalfFloatType });
const reflCam = new THREE.PerspectiveCamera();
const reflU = { tRefl: { value: reflRT.texture }, uTexMat: { value: new THREE.Matrix4() }, uReflOn: { value: 0 } };
function addReflection(m, k) {
  m.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, reflU, { uReflK: { value: k } });
    sh.vertexShader = 'varying vec3 vWPosR;\n' + sh.vertexShader.replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\nvWPosR = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    sh.fragmentShader = 'uniform sampler2D tRefl; uniform mat4 uTexMat; uniform float uReflOn; uniform float uReflK; varying vec3 vWPosR;\n' +
      sh.fragmentShader.replace('#include <tonemapping_fragment>', `
      if (uReflOn > 0.5) {
        vec4 pc = uTexMat * vec4(vWPosR, 1.0); vec2 ruv = pc.xy / pc.w; vec2 o = vec2(0.0025, 0.004);
        vec3 r = texture2D(tRefl, ruv).rgb * 0.36 + (texture2D(tRefl, ruv + vec2(o.x, 0.0)).rgb + texture2D(tRefl, ruv - vec2(o.x, 0.0)).rgb + texture2D(tRefl, ruv + vec2(0.0, o.y)).rgb + texture2D(tRefl, ruv - vec2(0.0, o.y)).rgb) * 0.16;
        float ndv = clamp(normalize(cameraPosition - vWPosR).y, 0.0, 1.0);
        float fres = 0.25 + 0.75 * pow(1.0 - ndv, 4.0);
        gl_FragColor.rgb += r * uReflK * fres;
      }
      #include <tonemapping_fragment>`);
  };
  m.customProgramCacheKey = () => 'refl' + k;
}

// ---------- materials ----------

  for (const g of geos) { vc += g.attributes.position.count; ic += g.index ? g.index.count : g.attributes.position.count; }

  let vo = 0, io = 0;
  for (const g of geos) {
    const n = g.attributes.position.count;
    pos.set(g.attributes.position.array, vo * 3);
    if (g.attributes.normal) nor.set(g.attributes.normal.array, vo * 3);
    if (g.attributes.uv) uv.set(g.attributes.uv.array, vo * 2);
    if (g.index) { const a = g.index.array; for (let k = 0; k < a.length; k++) idx[io++] = a[k] + vo; }
    else for (let k = 0; k < n; k++) idx[io++] = vo + k;
    vo += n; g.dispose();
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));

  if (AMBIENT.weekday === 'Mon' && h >= 10 && h < 10.5) return 'meeting';   // Part 17 item 33
  if (h >= 13 && h < 14) return 'lunch';

const WALKS = new Map(); // character → { pts, done }
/** Route to the last point with A* (round walls and furniture, through doors); the hand-made waypoints are only the fallback. */

  return r ? [...r.slice(1), end] : pts.map(q => [...q]);
}

function leaveSeat(ch) { if (ch.seat) { const s0 = ch.seat; s0.occupant = null; ch.seat = null; paintScreen(s0); } }

function startEmployeeMovement(data) {

  ch.sched = 'transit'; // Put in transit so followSchedule doesn't fight us
  
  const zKey = zoneForDept({ locationType: data.targetLocationType, locationName: data.targetLocationName });
  const zone = ZONES.find(z => zoneKey(z.name) === zKey);
  
  const bd = zone ? [zone.spawn[0], zone.spawn[1]] : [0, 20];

const EMP_STATE = { lastSync: null, total: 0, active: 0, unseated: [], ceoEmployee: null, departed: [], anniversaries: [], moves: [] };
function syncEmployees(list) {
  const byId = new Map(list.map(e => [e.id, e]));
  const ceo = list.find(e => e.status === 'ACTIVE' && isCeoEmployee(e));
  CHARACTERS.ceo.employee = ceo ?? null;                         // ARIA is the existing CEO character, never a second body
  // existing characters: follow status changes (TERMINATED → walk out; vanished from the list → removed)
  for (const [id, ch] of [...EMPLOYEES]) {
    const emp = byId.get(id);
    if (!emp) { if (!ch.leaving) despawnEmployee(id); continue; }
    ch.employee = emp; noteDiary(emp);
    if (emp.status === 'TERMINATED') depart(ch); else { applyPresence(ch); checkBurnout(ch); }
  }
  // new characters: ACTIVE, ON_HOLD and SUSPENDED employees get a desk (the latter two shown empty); TERMINATED never spawn
  const unseated = [];
  for (const emp of list.filter(e => e !== ceo && e.status !== 'TERMINATED' && !EMPLOYEES.has(e.id)).sort((a, b) => a.id.localeCompare(b.id)))
    if (!spawnEmployee(emp)) unseated.push(emp.name); else noteDiary(emp);
  Object.assign(EMP_STATE, { lastSync: new Date().toISOString(), total: list.length, active: list.filter(e => e.status === 'ACTIVE').length, unseated, ceoEmployee: ceo?.name ?? null });
}

/** A spot on a side room's inner partition wall (the one without the built-in TVs). u = metres into the room from the glass. */
function roomWallSpot(zoneName, u, y = 1.65) {
  const z = ZONES.find(zz => zz.name === zoneName); if (!z) return null;
  const [x0, x1, z0, z1] = z.rect, right = (x0 + x1) / 2 > 0;
  return right ? { x: 11 + u, y, z: z0 + 0.09, ry: 0 } : { x: -(11 + u), y, z: z1 - 0.09, ry: Math.PI };
}
function boardAt(name, zoneName, u, w, h, draw, px = 1024) {
  const sp = roomWallSpot(zoneName, u); if (!sp) return null;
  return wallPanel(name, sp.x, sp.y, sp.z, sp.ry, w, h, draw, px);
}

// item 74: mentoring — the most experienced person in a department visits the least experienced (real experience field)
const MENTOR = { busy: false, sessions: 0, last: null };
function mentoringVisit(force = false) {
  if (MENTOR.busy) return false;
  const h = AMBIENT.hour ?? 12; if (!force && (h < 10 || h >= 16 || (h >= 13 && h < 14))) return false;
  const here = [...EMPLOYEES.values()].filter(c => c.g.visible && c.sched === 'desk' && c.seat === c.homeSeat && !WALKS.has(c));
  const byDept = new Map(); for (const c of here) { const k = c.employee.departmentName ?? '?'; if (!byDept.has(k)) byDept.set(k, []); byDept.get(k).push(c); }
  for (const group of byDept.values()) {
    if (group.length < 2) continue;
    const xp = c => EMP_INFO.get(c.employee.id)?.experience ?? c.employee.experience ?? 0;
    const sorted = [...group].sort((a, b) => xp(b) - xp(a)), mentor = sorted[0], mentee = sorted[sorted.length - 1];
    if (!force && xp(mentor) - xp(mentee) < 10) continue;
    MENTOR.busy = true; MENTOR.sessions++; MENTOR.last = [mentor.employee.name, mentee.employee.name];
    const ms = mentee.homeSeat, spot = [ms.x + Math.cos(ms.yaw) * 0.75, ms.z - Math.sin(ms.yaw) * 0.75];
    mentor.sched = 'transit';
    walkPath(mentor, [beside(mentor.homeSeat), spot], () => {
      mentor.sched = 'mentoring'; mentor.g.rotation.y = Math.atan2(ms.x - spot[0], ms.z - spot[1]);
      speak(mentor.employee.name, `Let me show you a faster way to do that, ${mentee.employee.name}.`); logEvent('mentoring', `${mentor.employee.name} → ${mentee.employee.name}`);
      setTimeout(() => walkPath(mentor, [beside(mentor.homeSeat)], () => { sitIn(mentor, mentor.homeSeat); mentor.sched = 'desk'; MENTOR.busy = false; }), 9000);
    });
    return true;
  }
  return false;
}

// ---------- Task 12: ambience (generated office room tone; only ever starts from a user click) ----------
function roomToneWav(seconds = 8, rate = 22050) {
  const n = seconds * rate, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const w = (o, str) => [...str].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true);
  v.setUint16(22, 1, true); v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, 'data'); v.setUint32(40, n * 2, true);
  let brown = 0;
  for (let i = 0; i < n; i++) {
    brown = (brown + (Math.random() * 2 - 1) * 0.02) * 0.995;                       // soft brown noise (air handling)
    const hum = Math.sin(2 * Math.PI * 100 * i / rate) * 0.015;                        // faint mains hum
    const fade = Math.min(1, i / 2000, (n - i) / 2000);                               // no click at the loop seam
    v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, (brown * 3 + hum) * fade)) * 32767 * 0.5, true);
  }
  return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}
const ambienceEl = document.getElementById('ambience'), audioBtn = document.getElementById('mAudio');
ambienceEl.volume = 0.35;
async function toggleAmbience() {
  if (!ambienceEl.src) ambienceEl.src = roomToneWav();
  if (ambienceEl.paused) { try { await ambienceEl.play(); } catch (err) { console.warn('ambience blocked:', err.message); } }
  else ambienceEl.pause();
  const on = !ambienceEl.paused; audioBtn.textContent = `Ambience: ${on ? 'on' : 'off'}`; audioBtn.setAttribute('aria-pressed', String(on));
  return on;
}

// ---------- Items 12-17: every room's screens show that department's real data (#15 audit) ----------
// Each side room's TVs used to show a baked, random "dashboard" texture (decorative, fake). They are covered here with
// live panels. Positions come from the interiors: desks / lab rooms have TVs at u 6 and 13, mixed rooms at u 15,
// the lounge at u 8.6, meeting rooms (Board Room, Legal) a big screen on the end wall, Data & Analytics a video wall.
function endWallPanel(name, zoneName, u, y, w, h, draw) {
  const z = ZONES.find(zz => zz.name === zoneName); if (!z) return null;
  const right = (z.rect[0] + z.rect[1]) / 2 > 0, zc = (z.rect[2] + z.rect[3]) / 2;
  const p = wallPanel(name, right ? X0 + u : -(X0 + u), y, zc, right ? -Math.PI / 2 : Math.PI / 2, w, h, draw, 1024);
  const old = p.mesh.material; p.mesh.material = new THREE.MeshBasicMaterial({ map: old.map, toneMapped: false }); old.dispose();
  return p;
}
function freePanel(name, x, y, z, ry, w, h, draw) { // for the CEO / Chairman office TVs (world coordinates)
  const p = wallPanel(name, x, y, z, ry, w, h, draw, 1024);
  const old = p.mesh.material; p.mesh.material = new THREE.MeshBasicMaterial({ map: old.map, toneMapped: false }); old.dispose();
  return p;
}
const bulletList = (g, W2, H2, rows, top = 0.2, size = 26, empty = 'No data yet') => {
  if (!rows.length) return line(g, empty, W2 * 0.05, H2 * (top + 0.1), size + 4, '#8b93b5');
  rows.forEach((t, i) => line(g, `• ${t}`, W2 * 0.05, H2 * top + i * (size * 1.35), size, '#cfd3e6', W2 * 0.9));
};
function pie(g, cx, cy, r, values, colors) {
  const total = values.reduce((a, b) => a + b, 0); if (!total) return false;
  let a0 = -Math.PI / 2;
  values.forEach((v, i) => { if (!v) return; const a1 = a0 + (v / total) * Math.PI * 2; g.fillStyle = colors[i]; g.beginPath(); g.moveTo(cx, cy); g.arc(cx, cy, r, a0, a1); g.closePath(); g.fill(); a0 = a1; });
  return true;
}

  stages.forEach(([k, v], i) => { const y = H2 * (0.63 + i * 0.055), w = (W2 * 0.6) * v / max; g.fillStyle = '#5b8cff'; g.fillRect(W2 * 0.28, y, w, H2 * 0.04); line(g, trim(k, 16), W2 * 0.06, y, 22, '#9aa3c2'); line(g, v, W2 * 0.29 + w, y, 22, '#fff'); });
}, 1024);
{ const old = projector.mesh.material; projector.mesh.material = new THREE.MeshBasicMaterial({ map: old.map, toneMapped: false }); old.dispose(); } // unlit: the room's screen light must not wash out the slide
const PROJ = { last: 0, timer: 0 };
function drawProjector() { // at most one repaint every 3 s
  const wait = 3000 - (performance.now() - PROJ.last);
  if (wait > 0) { if (!PROJ.timer) PROJ.timer = setTimeout(() => { PROJ.timer = 0; drawProjector(); }, wait); return; }
  PROJ.last = performance.now(); projector.redraw();
}
for (const k of ['survival', 'leads', 'projects', 'decisions']) onData(k, () => { if (BOARD.meeting) drawProjector(); });

boardUi.pause.onclick = () => {
  BOARD.paused = !BOARD.paused; boardUi.pause.textContent = BOARD.paused ? 'Resume' : 'Pause';
  if (BOARD.meeting) act('boardroom', { op: BOARD.paused ? 'pause' : 'resume', id: BOARD.meeting.id }); // the room stops talking too
  if (BOARD.paused) { window.speechSynthesis?.pause(); } else { window.speechSynthesis?.resume(); playNext(); }
};
bEl('bSkip').onclick = skipLine;
boardUi.mute.onclick = () => { BOARD.muted = !BOARD.muted; boardUi.mute.textContent = BOARD.muted ? 'Unmute' : 'Mute'; boardUi.mute.setAttribute('aria-pressed', String(BOARD.muted)); if (BOARD.muted) skipLine(); };
bEl('bPrev').onclick = () => { BOARD.manualSlide = Math.max(0, slideIndex() - 1); PROJ.last = 0; drawProjector(); };
bEl('bNext').onclick = () => { BOARD.manualSlide = Math.min(deckSlides(BOARD.meeting).length - 1, slideIndex() + 1); PROJ.last = 0; drawProjector(); };
bEl('bEnd').onclick = () => { if (BOARD.meeting) act('boardroom', { op: 'end', id: BOARD.meeting.id }); };
function chairmanSays(text) {
  text = String(text ?? '').trim(); if (!text || !BOARD.meeting) return;
  BOARD.waiting = true; act('boardroom', { op: 'say', id: BOARD.meeting.id, text });
}
bEl('bSay').onclick = () => {
  if (!SR) return chairmanSays(prompt('Say to the board:'));
  const r = new SR(); r.lang = LANG.current === 'hi' ? 'hi-IN' : 'en-IN'; r.interimResults = false;
  r.onresult = ev => chairmanSays(ev.results[0][0].transcript); r.onerror = () => chairmanSays(prompt('Say to the board:'));
  showSubtitle('Listening…', 4000); r.start();
};

// Item 37: business news channel on the Executive Lounge TV (not the Boardroom). YouTube can't be a WebGL texture, so it's
// an HTML iframe laid over the TV's position on your monitor. Only while you're in the lounge and no board meeting is
// talking (sound on); hidden, muted and unloaded elsewhere. With no URL the TV shows "AEVORA today".
const LOUNGE_Z = ZONES.find(z => z.name === 'EXECUTIVE LOUNGE'), NEWS_TV = { x: X0 + 8.6, y: 1.92, z: LOUNGE_Z.rect[3] - 0.14, w: 2.2, h: 1.24 }; // = loungeTv
// NEWS moved up
function setNewsUrl(u) {
  u = String(u ?? '').trim();
  NEWS.url = /^https:\/\/www\.(youtube|youtube-nocookie)\.com\/embed\//.test(u) ? u : ''; // YouTube embeds only
}
function newsFrame() {
  if (NEWS.el) return NEWS.el;
  const f = document.createElement('iframe');
  Object.assign(f.style, { position: 'fixed', border: '0', zIndex: 3, pointerEvents: 'auto', background: '#000', display: 'none' });
  f.allow = 'autoplay; encrypted-media; picture-in-picture'; f.title = 'Business news'; document.body.appendChild(f);
  return (NEWS.el = f);
}
const _nc = [new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()];
setInterval(() => {
  const inRoom = walking && lastZone === 'EXECUTIVE LOUNGE' && !BOARD.meeting && NEWS.url && RENDER.running;
  if (!inRoom) { if (NEWS.live) { NEWS.el.src = 'about:blank'; NEWS.el.style.display = 'none'; NEWS.live = false; } return; }
  const f = newsFrame();
  if (!NEWS.live) { const sep = NEWS.url.includes('?') ? '&' : '?'; f.src = `${NEWS.url}${sep}autoplay=1&mute=0&playsinline=1`; NEWS.live = true; }
  // Screen-space box of the TV's four corners (it faces into the lounge, so an axis-aligned box fits well).
  const hw = NEWS_TV.w / 2, hh = NEWS_TV.h / 2, r = renderer.domElement.getBoundingClientRect();
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity, behind = false;
  [[-hw, -hh], [hw, -hh], [hw, hh], [-hw, hh]].forEach(([dx, dy], i) => {
    const v = _nc[i].set(NEWS_TV.x + dx, NEWS_TV.y + dy, NEWS_TV.z).project(cam);
    if (v.z > 1) behind = true;
    const sx = r.left + (v.x + 1) / 2 * r.width, sy = r.top + (1 - v.y) / 2 * r.height;
    x0 = Math.min(x0, sx); x1 = Math.max(x1, sx); y0 = Math.min(y0, sy); y1 = Math.max(y1, sy);
  });
  if (behind || x1 - x0 < 40) { f.style.display = 'none'; return; }
  Object.assign(f.style, { display: 'block', left: `${x0}px`, top: `${y0}px`, width: `${x1 - x0}px`, height: `${y1 - y0}px` });
}, 60);

// "I have a summary of N meetings": said once when you're signed in, and again when you sit at your desk.
function announceBriefs() {
  const n = BOARD.briefs.length; if (!n) return;
  speak('Assistant', `I have a summary of ${n} board meeting${n > 1 ? 's' : ''} I led for you. Click “Read meeting summary” or say “Hey Aevora, read the summary”.`);
}
onData('boardroomBriefing', list => {
  const all = Array.isArray(list) ? list : [];
  BOARD.briefs = all.filter(b => b.status !== 'SUMMARIZING' && b.summary); BOARD.preparing = all.filter(b => b.status === 'SUMMARIZING'); // #48
  boardUi.brief.hidden = !BOARD.briefs.length;
  if (!BOARD.announced && BOARD.briefs.length) { BOARD.announced = true; setTimeout(announceBriefs, 2500); }
});
function readBriefs() {
  const b = BOARD.briefs[0];
  if (!b && BOARD.preparing?.length) { speak('Assistant', `I'm still writing up “${BOARD.preparing[0].title}”. I'll brief you as soon as the summary is ready.`); return false; }
  if (!b) { speak('Assistant', 'No new meeting summaries.'); return false; }
  speak('Assistant', `Summary of “${b.title}”.`);
  if (window.speechSynthesis && !BOARD.muted) { const u = new SpeechSynthesisUtterance(b.summary); u.lang = 'en-IN'; u.rate = 1; speechSynthesis.cancel(); sayUtterance(u); }
  act('boardroom', { op: 'briefed', id: b.id });
  return true;
}
boardUi.brief.onclick = readBriefs;

let last = performance.now(), lastZone = '';
const orig = stage._loop;
const loop = () => {
  const now = performance.now(), dt = Math.min((now - last) / 1000, 0.05); last = now;
  holos.forEach((h, i) => h.rotateY(dt * (i % 2 ? -0.15 : 0.12)));
  animateTyping(now);
  halo.material.opacity = 0.7 + Math.sin(now * 0.0015) * 0.1;
  if (walking) {
    const run = keys.has('ShiftLeft') || keys.has('ShiftRight'), sp = (run ? 5.5 : 2.4) * dt;
    let f = 0, s = 0;
    if (keys.has('KeyW') || keys.has('ArrowUp')) f++; if (keys.has('KeyS') || keys.has('ArrowDown')) f--;
    if (keys.has('KeyD')) s++; if (keys.has('KeyA')) s--;
    if (keys.has('ArrowLeft')) yaw += 1.6 * dt; if (keys.has('ArrowRight')) yaw -= 1.6 * dt;
    const p = cam.position;
    if (sittingAt && (f || s)) standUp(); // any move key gets you up
    if (f || s) {
      const l = Math.hypot(f, s); f /= l; s /= l;
      const dx = (-Math.sin(yaw) * f + Math.cos(yaw) * s) * sp, dz = (-Math.cos(yaw) * f - Math.sin(yaw) * s) * sp;
      if (!playerBlocked(p.x + dx, p.z)) p.x += dx;
      if (!playerBlocked(p.x, p.z + dz)) p.z += dz;
      bob += dt * (run ? 13 : 8);
    }
    p.y = sittingAt ? EYE_SEATED : EYE + Math.sin(bob) * 0.02;
    cam.rotation.set(pitch, yaw, 0, 'YXZ'); cam.updateMatrixWorld();
    const z = ZONES.slice().reverse().find(z => p.x >= z.rect[0] && p.x <= z.rect[1] && p.z >= z.rect[2] && p.z <= z.rect[3]);
    const label = z ? z.name : 'Main concourse';
    if (label !== lastZone) { ui.where.textContent = label; lastZone = label; if (label === 'ENTRANCE') assistantBackToDesk(); aevoraNotify('ROOM_ENTER', { key: zoneKey(label), name: label }); if (typeof onEnterZone === 'function') onEnterZone(label); }
    setNearDesk(Math.hypot(p.x - DESK.x, p.z - DESK.z) < DESK.reach);
    updateSeats(p);
    renderReflection();
    renderer.render(scene, cam);
  } else {
    if (fly) { fly.t = Math.min(1, fly.t + dt / 1.2); const k = 1 - Math.pow(1 - fly.t, 3);
      cam.position.lerpVectors(fly.p0, fly.p1, k); controls.target.lerpVectors(fly.t0, fly.t1, k); if (fly.t >= 1) fly = null; }
    orig();
  }
};
stage._loop = loop; renderer.setAnimationLoop(loop);
// Item 25: while OfficeOS (the desk laptop) covers the office, stop rendering the 3D scene; resume on return.
// RENDER moved up
function setRenderPaused(paused) {
  if (RENDER.running === !paused) return;
  RENDER.running = !paused; renderer.setAnimationLoop(paused ? null : loop);
  if (paused) assistantBackToDesk();
  if (!paused) last = performance.now(); // no giant dt jump after the pause
}
// Localhost only: render-cost probe (works even when the tab is hidden and rAF is paused).
if (DEV) window.__perf = (frames = 30) => {
  const t0 = performance.now(); for (let i = 0; i < frames; i++) loop(); const ms = (performance.now() - t0) / frames;
  const i = renderer.info;
  return { msPerFrame: +ms.toFixed(2), maxFps: Math.round(1000 / ms), drawCalls: i.render.calls, triangles: i.render.triangles, geometries: i.memory.geometries, textures: i.memory.textures, walking, loopRunning: RENDER.running };
};
window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const key = e.key.toUpperCase();
  if (key === 'V') {
    e.preventDefault();
    const cmd = prompt("Speak/Type command for ALL employees:");
    if (cmd) aevoraNotify('BROADCAST_CMD', { text: cmd });
  } else if (key === 'U') {
    e.preventDefault();
    const cmd = prompt("Speak/Type command for Assistant:");
    if (cmd) aevoraNotify('ASSISTANT_CMD', { text: cmd });
  } else if (key === 'Y') {
    e.preventDefault();
    const cmd = prompt("Speak/Type command for CEO:");
    if (cmd) aevoraNotify('CEO_CMD', { text: cmd });
  }
});
</script>
