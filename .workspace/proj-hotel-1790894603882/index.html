<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hotel App Core</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Grand Hotel</h1>
    <nav>
      <button onclick="showTab('rooms')">Rooms</button>
      <button onclick="showTab('guests')">Guests</button>
      <button onclick="showTab('bookings')">Bookings</button>
    </nav>
  </header>
  <main>
    <section id="rooms" class="tab">
      <h2>Available Rooms</h2>
      <form id="roomForm">
        <input type="text" id="roomNum" placeholder="Room Number" required>
        <input type="text" id="roomType" placeholder="Type (e.g., Deluxe)" required>
        <button type="submit">Add Room</button>
      </form>
      <ul id="roomList"></ul>
    </section>
    <section id="guests" class="tab" style="display:none;">
      <h2>Guest Management</h2>
      <form id="guestForm">
        <input type="text" id="guestName" placeholder="Guest Name" required>
        <input type="email" id="guestEmail" placeholder="Email" required>
        <button type="submit">Add Guest</button>
      </form>
      <ul id="guestList"></ul>
    </section>
    <section id="bookings" class="tab" style="display:none;">
      <h2>Room Booking</h2>
      <form id="bookingForm">
        <select id="bookGuest" required><option value="">Select Guest</option></select>
        <select id="bookRoom" required><option value="">Select Room</option></select>
        <button type="submit">Book Room</button>
      </form>
      <ul id="bookingList"></ul>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
