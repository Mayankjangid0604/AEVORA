name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aevora
          POSTGRES_PASSWORD: aevora
          POSTGRES_DB: aevora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aevora -d aevora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Throwaway CI container only. Never point CI at the live Neon DB.
      DATABASE_URL: postgresql://aevora:aevora@localhost:5432/aevora_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Prisma generate
        working-directory: packages/database
        run: npx prisma generate

      # Turbo's strict env mode needs DATABASE_URL in turbo.json passThroughEnv for DB-backed tests.
      - name: Apply migrations to CI Postgres
        working-directory: packages/database
        run: npx prisma migrate deploy

      # Build workspace packages first so @aevora/* imports resolve for typecheck
      - name: Build packages
        run: npx turbo run build --filter='./packages/*'

      - name: Typecheck API
        working-directory: apps/api
        run: npx tsc --noEmit -p .

      - name: Typecheck Web
        working-directory: apps/web
        run: npx tsc --noEmit

      # 0 errors required; `any` and console are warnings.
      - name: Lint
        run: npm run lint

      # Includes `next build` for apps/web.
      - name: Build
        run: npx turbo run build

      - name: Test
        run: npm test
