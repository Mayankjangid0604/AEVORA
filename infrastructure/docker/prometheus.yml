global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'aevora-api'
    static_configs:
      - targets: ['api:3001'] # Internal docker network hostname

  - job_name: 'aevora-web'
    static_configs:
      - targets: ['web:3000'] # Internal docker network hostname

  # Optional: Add node-exporter or postgres-exporter if they are running
