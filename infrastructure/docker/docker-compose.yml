# Local dev DB. DATABASE_URL=postgresql://aevora:secret@localhost:5432/aevoradb?schema=public
# (defaults below; override with POSTGRES_USER/PASSWORD/DB). Start + migrate + seed: npm run db:local:setup
services:
  postgres:
    image: postgres:15-alpine
    container_name: aevora_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aevora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-aevoradb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aevora} -d ${POSTGRES_DB:-aevoradb}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aevora_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning

volumes:
  postgres_data:
  redis_data:
